[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pioformer"
version = "0.1.0"
description = "Three-stage Pioformer trajectory prediction for Argoverse 1"
readme = "README.md"
requires-python = ">=3.8,<3.11"
dependencies = [
  "torch==1.13.0",
  "torch-geometric==2.3.0",
  "pytorch-lightning==1.5.2",
  "torchmetrics==0.10.3",
  "numpy>=1.19,<1.24",
  "pandas>=1.4,<2",
  "PyYAML>=6.0,<7",
  "omegaconf==2.1.0",
  "tqdm>=4.65,<5",
  "scipy>=1.9,<1.11",
  "matplotlib>=3.6,<3.8",
  "shapely>=2.0,<2.1",
  "opencv-python>=4.8,<5",
  "descartes>=1.1,<2",
  "colour==0.1.5",
  "imageio>=2.30,<3",
]

[tool.setuptools.packages.find]
include = ["pioformer*"]
